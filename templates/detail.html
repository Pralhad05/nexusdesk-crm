<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticket Details - NexusDesk</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col font-sans">
    
    <!-- Navigation Bar -->
    <nav class="bg-white border-b border-slate-200 shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <a href="/dashboard" class="flex items-center gap-3">
                    <div class="w-9 h-9 bg-indigo-600 rounded-lg flex items-center justify-center shadow-md">
                        <svg class="w-6 h-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z" />
                        </svg>
                    </div>
                    <span class="text-xl font-extrabold text-slate-800 tracking-tight">Nexus<span class="text-indigo-600">Desk</span></span>
                </a>
                
                <div class="hidden md:flex items-center gap-4">
                    <a href="/dashboard" class="text-slate-600 hover:text-indigo-600 font-medium text-sm px-3 py-2 rounded-md transition-colors">Dashboard</a>
                    <a href="/create" class="bg-indigo-600 text-white px-5 py-2.5 rounded-lg hover:bg-indigo-700 font-semibold text-sm flex items-center gap-2 shadow-sm">
                        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" /></svg>
                        New Ticket
                    </a>
                    <button onclick="localStorage.removeItem('token'); window.location.href='/login';" class="text-red-500 hover:text-red-700 font-medium text-sm ml-2 px-3 py-2">Logout</button>
                </div>

                <!-- Mobile Hamburger -->
                <button id="mobile-menu-btn" class="md:hidden flex items-center justify-center w-10 h-10 rounded-lg text-slate-600 hover:bg-slate-100">
                    <svg id="menu-open-icon" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                    </svg>
                    <svg id="menu-close-icon" class="w-6 h-6 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>
        </div>

        <!-- Mobile Menu -->
        <div id="mobile-menu" class="md:hidden hidden border-t border-slate-200 bg-white">
            <div class="px-4 py-3 space-y-2">
                <a href="/dashboard" class="block px-3 py-2 rounded-md text-slate-600 hover:bg-indigo-50 hover:text-indigo-600 font-medium">Dashboard</a>
                <a href="/create" class="block w-full text-center bg-indigo-600 text-white px-5 py-2.5 rounded-lg hover:bg-indigo-700 font-semibold text-sm">New Ticket</a>
                <button onclick="localStorage.removeItem('token'); window.location.href='/login';" class="block w-full text-center text-red-500 hover:text-red-700 font-medium text-sm py-2">Logout</button>
            </div>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full flex-1">
        <!-- Fixed Link to Dashboard -->
        <a href="/dashboard" class="text-indigo-600 hover:text-indigo-800 text-sm font-medium flex items-center gap-1 mb-6">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
            </svg>
            Back to Dashboard
        </a>

        <div id="ticket-container" class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="flex justify-center py-12 lg:col-span-3">
                <div class="w-10 h-10 border-4 border-slate-200 border-t-indigo-600 rounded-full animate-spin"></div>
            </div>
        </div>
    </main>

    <script>
        // 1. Auth Check
        const token = localStorage.getItem('token');
        if (!token) {
            window.location.href = '/login';
        }

        // 2. Helper function
        function getHeaders() {
            return { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` };
        }

        // 3. Mobile Menu Toggle
        const mobileMenuBtn = document.getElementById('mobile-menu-btn');
        const mobileMenu = document.getElementById('mobile-menu');
        const openIcon = document.getElementById('menu-open-icon');
        const closeIcon = document.getElementById('menu-close-icon');

        if(mobileMenuBtn) {
            mobileMenuBtn.addEventListener('click', () => {
                mobileMenu.classList.toggle('hidden');
                openIcon.classList.toggle('hidden');
                closeIcon.classList.toggle('hidden');
            });
        }

        // 4. Ticket Logic
        const ticketId = "{{ ticket_id }}";
        const API_URL = `/api/tickets/${ticketId}`;

        function formatDate(dateStr) {
            return new Date(dateStr).toLocaleString('en-US', { month: 'short', day: 'numeric', year: 'numeric', hour: '2-digit', minute: '2-digit' });
        }

        async function loadTicket() {
            try {
                const res = await fetch(API_URL, { headers: getHeaders() }); // ADDED AUTH
                if (res.status === 401) { window.location.href = '/login'; return; }
                if (!res.ok) throw new Error('Ticket not found');
                const ticket = await res.json();
                renderTicket(ticket);
            } catch (e) {
                document.getElementById('ticket-container').innerHTML = `<p class="text-red-500 col-span-3 text-center py-12">${e.message}</p>`;
            }
        }

        function renderTicket(t) {
            let statusColor = 'bg-slate-100 text-slate-600 border border-slate-200';
            if (t.status === 'Open') statusColor = 'bg-emerald-50 text-emerald-700 border border-emerald-200';
            if (t.status === 'In Progress') statusColor = 'bg-amber-50 text-amber-700 border border-amber-200';
            if (t.status === 'Closed') statusColor = 'bg-slate-100 text-slate-500 border border-slate-200';

            const notesHtml = t.notes.length === 0 ? '<p class="text-slate-400 text-sm text-center py-4">No notes yet.</p>' : 
                t.notes.reverse().map(n => `
                    <div class="bg-slate-50 border border-slate-100 rounded-xl p-4 mb-3">
                        <p class="text-slate-700 text-sm whitespace-pre-wrap">${n.note_text}</p>
                        <p class="text-xs text-slate-400 mt-3">${formatDate(n.created_at)}</p>
                    </div>
                `).join('');

            document.getElementById('ticket-container').innerHTML = `
                <!-- Left Column -->
                <div class="lg:col-span-2 space-y-6">
                    <div class="bg-white border border-slate-200 rounded-2xl p-6 shadow-sm">
                        <div class="flex flex-col sm:flex-row justify-between items-start mb-4 gap-4">
                            <div>
                                <span class="text-sm font-mono text-indigo-600 font-bold bg-indigo-50 px-2 py-0.5 rounded">${t.ticket_id}</span>
                                <h1 class="text-2xl font-extrabold text-slate-800 mt-2">${t.subject}</h1>
                            </div>
                            <span class="px-3 py-1 rounded-full text-sm font-semibold ${statusColor}">${t.status}</span>
                        </div>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 text-sm border-t border-slate-100 pt-4">
                            <div><span class="text-slate-500">Customer:</span> <span class="font-semibold text-slate-800 ml-1">${t.customer_name}</span></div>
                            <div><span class="text-slate-500">Email:</span> <span class="font-semibold text-slate-800 ml-1">${t.customer_email}</span></div>
                            <div><span class="text-slate-500">Created:</span> <span class="font-semibold text-slate-800 ml-1">${formatDate(t.created_at)}</span></div>
                            <div><span class="text-slate-500">Updated:</span> <span class="font-semibold text-slate-800 ml-1">${formatDate(t.updated_at)}</span></div>
                        </div>
                    </div>

                    <div class="bg-white border border-slate-200 rounded-2xl p-6 shadow-sm">
                        <h2 class="text-sm font-bold text-slate-500 uppercase tracking-wide mb-3">Description</h2>
                        <p class="text-slate-800 whitespace-pre-wrap leading-relaxed">${t.description}</p>
                    </div>

                    <div class="bg-white border border-slate-200 rounded-2xl p-6 shadow-sm">
                        <h2 class="text-sm font-bold text-slate-500 uppercase tracking-wide mb-4">Update Ticket</h2>
                        <form id="update-form">
                            <div class="mb-4">
                                <label class="block text-sm font-semibold text-slate-700 mb-1">Status</label>
                                <select id="update-status" class="w-full border border-slate-300 rounded-xl px-4 py-3 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition">
                                    <option value="Open" ${t.status === 'Open' ? 'selected' : ''}>Open</option>
                                    <option value="In Progress" ${t.status === 'In Progress' ? 'selected' : ''}>In Progress</option>
                                    <option value="Closed" ${t.status === 'Closed' ? 'selected' : ''}>Closed</option>
                                </select>
                            </div>
                            <div class="mb-4">
                                <label class="block text-sm font-semibold text-slate-700 mb-1">Add Note</label>
                                <textarea id="update-note" rows="3" placeholder="What did you do? What is the next step?" class="w-full border border-slate-300 rounded-xl px-4 py-3 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition resize-vertical"></textarea>
                            </div>
                            <div id="update-error" class="text-red-500 text-sm mb-2 hidden"></div>
                            <button type="submit" class="bg-indigo-600 text-white px-6 py-3 rounded-xl hover:bg-indigo-700 font-bold transition shadow-sm hover:shadow-md">Submit Update</button>
                        </form>
                    </div>
                </div>

                <!-- Right Column (Notes) -->
                <div class="lg:col-span-1">
                    <div class="bg-white border border-slate-200 rounded-2xl p-6 shadow-sm sticky top-24">
                        <h2 class="text-sm font-bold text-slate-500 uppercase tracking-wide mb-4">Activity Notes</h2>
                        <div id="notes-container">${notesHtml}</div>
                    </div>
                </div>
            `;

            // Attach form submit listener
            document.getElementById('update-form').addEventListener('submit', handleUpdate);
        }

        async function handleUpdate(e) {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            const errDiv = document.getElementById('update-error');
            errDiv.classList.add('hidden');
            btn.textContent = 'Updating...';
            btn.disabled = true;

            const payload = {
                status: document.getElementById('update-status').value,
                notes: document.getElementById('update-note').value.trim()
            };

            try {
                const res = await fetch(API_URL, {
                    method: 'PUT',
                    headers: getHeaders(), // ADDED AUTH
                    body: JSON.stringify(payload)
                });
                if (res.status === 401) { window.location.href = '/login'; return; }
                if (!res.ok) {
                    const err = await res.json();
                    throw new Error(err.detail || 'Update failed');
                }
                // Reload data on success
                loadTicket();
            } catch (error) {
                errDiv.textContent = error.message;
                errDiv.classList.remove('hidden');
                btn.textContent = 'Submit Update';
                btn.disabled = false;
            }
        }

        loadTicket();
    </script>
</body>
</html>
