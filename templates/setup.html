<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusDesk - Setup</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-lg bg-white rounded-2xl shadow-xl p-8 text-center">
        <div class="w-16 h-16 bg-indigo-100 rounded-full flex items-center justify-center mx-auto mb-6">
            <svg class="w-8 h-8 text-indigo-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z" />
            </svg>
        </div>
        <h1 class="text-2xl font-extrabold text-slate-800 mb-2">Welcome to NexusDesk!</h1>
        <p class="text-slate-500 mb-8">What is your primary purpose for using this platform?</p>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 text-left">
            <button onclick="selectPurpose('IT Support')"
                class="purpose-btn border-2 border-slate-200 rounded-xl p-4 hover:border-indigo-600 hover:bg-indigo-50 transition group">
                <h3 class="font-bold text-slate-800 group-hover:text-indigo-700">IT Support</h3>
                <p class="text-xs text-slate-500 mt-1">Internal tech issues</p>
            </button>
            <button onclick="selectPurpose('Customer Success')"
                class="purpose-btn border-2 border-slate-200 rounded-xl p-4 hover:border-indigo-600 hover:bg-indigo-50 transition group">
                <h3 class="font-bold text-slate-800 group-hover:text-indigo-700">Customer Success</h3>
                <p class="text-xs text-slate-500 mt-1">External client help</p>
            </button>
            <button onclick="selectPurpose('Billing')"
                class="purpose-btn border-2 border-slate-200 rounded-xl p-4 hover:border-indigo-600 hover:bg-indigo-50 transition group">
                <h3 class="font-bold text-slate-800 group-hover:text-indigo-700">Billing</h3>
                <p class="text-xs text-slate-500 mt-1">Payments & invoices</p>
            </button>
            <button onclick="selectPurpose('General')"
                class="purpose-btn border-2 border-slate-200 rounded-xl p-4 hover:border-indigo-600 hover:bg-indigo-50 transition group">
                <h3 class="font-bold text-slate-800 group-hover:text-indigo-700">General</h3>
                <p class="text-xs text-slate-500 mt-1">Miscellaneous queries</p>
            </button>
        </div>
    </div>

    <script>
        async function selectPurpose(purpose) {
            const token = localStorage.getItem('token');
            if (!token) { window.location.href = '/login'; return; }

            try {
                const res = await fetch('/api/auth/setup-purpose', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token, purpose })
                });
                if (!res.ok) throw new Error('Failed to save');
                const data = await res.json();
                localStorage.setItem('token', data.access_token); // Update token with purpose
                window.location.href = '/';
            } catch (e) { alert(e.message); }
        }
        localStorage.setItem('token', data.access_token);
        window.location.href = '/dashboard'; // CHANGED FROM '/' TO '/dashboard'
    </script>
</body>

</html>
