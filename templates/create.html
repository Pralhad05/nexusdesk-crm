<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Ticket - NexusDesk</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col font-sans">
    
    <!-- Navigation Bar -->
    <nav class="bg-white border-b border-slate-200 shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <a href="/dashboard" class="flex items-center gap-3">
                    <div class="w-9 h-9 bg-indigo-600 rounded-lg flex items-center justify-center shadow-md">
                        <svg class="w-6 h-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z" />
                        </svg>
                    </div>
                    <span class="text-xl font-extrabold text-slate-800 tracking-tight">Nexus<span class="text-indigo-600">Desk</span></span>
                </a>
                
                <div class="hidden md:flex items-center gap-4">
                    <a href="/dashboard" class="text-slate-600 hover:text-indigo-600 font-medium text-sm px-3 py-2 rounded-md transition-colors">Dashboard</a>
                    <a href="/create" class="bg-indigo-600 text-white px-5 py-2.5 rounded-lg hover:bg-indigo-700 font-semibold text-sm flex items-center gap-2 shadow-sm">
                        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" /></svg>
                        New Ticket
                    </a>
                    <button onclick="localStorage.removeItem('token'); window.location.href='/login';" class="text-red-500 hover:text-red-700 font-medium text-sm ml-2 px-3 py-2">Logout</button>
                </div>

                <!-- Mobile Hamburger -->
                <button id="mobile-menu-btn" class="md:hidden flex items-center justify-center w-10 h-10 rounded-lg text-slate-600 hover:bg-slate-100">
                    <svg id="menu-open-icon" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                    </svg>
                    <svg id="menu-close-icon" class="w-6 h-6 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>
        </div>

        <!-- Mobile Menu -->
        <div id="mobile-menu" class="md:hidden hidden border-t border-slate-200 bg-white">
            <div class="px-4 py-3 space-y-2">
                <a href="/dashboard" class="block px-3 py-2 rounded-md text-slate-600 hover:bg-indigo-50 hover:text-indigo-600 font-medium">Dashboard</a>
                <a href="/create" class="block w-full text-center bg-indigo-600 text-white px-5 py-2.5 rounded-lg hover:bg-indigo-700 font-semibold text-sm">New Ticket</a>
                <button onclick="localStorage.removeItem('token'); window.location.href='/login';" class="block w-full text-center text-red-500 hover:text-red-700 font-medium text-sm py-2">Logout</button>
            </div>
        </div>
    </nav>

    <main class="max-w-2xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full flex-1">
        <!-- Fixed Link to Dashboard -->
        <a href="/dashboard" class="text-indigo-600 hover:text-indigo-800 text-sm font-medium flex items-center gap-1 mb-4">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
            </svg>
            Back to Dashboard
        </a>
        <h1 class="text-2xl font-extrabold text-slate-800 mb-1">Create New Ticket</h1>
        <p class="text-slate-500 mb-6">Fill in the details to create a support ticket</p>

        <form id="create-ticket-form" class="bg-white border border-slate-200 rounded-2xl p-6 sm:p-8 shadow-sm space-y-6">
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">Customer Name <span class="text-red-500">*</span></label>
                <input type="text" id="customer_name" required placeholder="John Doe" class="w-full border border-slate-300 rounded-xl px-4 py-3 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition">
            </div>
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">Customer Email <span class="text-red-500">*</span></label>
                <input type="email" id="customer_email" required placeholder="john@example.com" class="w-full border border-slate-300 rounded-xl px-4 py-3 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition">
            </div>
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">Subject <span class="text-red-500">*</span></label>
                <input type="text" id="subject" required placeholder="Brief description of the issue" class="w-full border border-slate-300 rounded-xl px-4 py-3 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition">
            </div>
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">Description <span class="text-red-500">*</span></label>
                <textarea id="description" required rows="6" placeholder="Provide detailed information about the issue..." class="w-full border border-slate-300 rounded-xl px-4 py-3 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition resize-vertical"></textarea>
            </div>
            <div id="error-message" class="text-red-500 text-sm hidden"></div>
            <button type="submit" id="submit-btn" class="w-full sm:w-auto bg-indigo-600 text-white px-8 py-3 rounded-xl hover:bg-indigo-700 font-bold transition shadow-sm hover:shadow-md">
                Create Ticket
            </button>
        </form>
    </main>

    <script>
        // 1. Auth Check
        const token = localStorage.getItem('token');
        if (!token) {
            window.location.href = '/login';
        }

        // 2. Mobile Menu Toggle
        const mobileMenuBtn = document.getElementById('mobile-menu-btn');
        const mobileMenu = document.getElementById('mobile-menu');
        const openIcon = document.getElementById('menu-open-icon');
        const closeIcon = document.getElementById('menu-close-icon');

        if(mobileMenuBtn) {
            mobileMenuBtn.addEventListener('click', () => {
                mobileMenu.classList.toggle('hidden');
                openIcon.classList.toggle('hidden');
                closeIcon.classList.toggle('hidden');
            });
        }

        // 3. Form Submission
        document.getElementById('create-ticket-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            const errorMsg = document.getElementById('error-message');
            errorMsg.classList.add('hidden');
            
            btn.textContent = 'Creating...';
            btn.disabled = true;

            const data = {
                customer_name: document.getElementById('customer_name').value,
                customer_email: document.getElementById('customer_email').value,
                subject: document.getElementById('subject').value,
                description: document.getElementById('description').value
            };

            try {
                const res = await fetch('/api/tickets', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}` // ADDED AUTH HEADER
                    },
                    body: JSON.stringify(data)
                });

                if (!res.ok) {
                    const err = await res.json();
                    throw new Error(err.detail || 'Failed to create ticket');
                }

                // Redirect to Dashboard on success
                window.location.href = '/dashboard';
            } catch (error) {
                errorMsg.textContent = error.message;
                errorMsg.classList.remove('hidden');
                btn.textContent = 'Create Ticket';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
