<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusDesk - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md">
        <!-- Logo Header -->
        <div class="text-center mb-8">
            <a href="/" class="inline-flex items-center gap-3">
                <div class="w-12 h-12 bg-indigo-600 rounded-xl flex items-center justify-center shadow-lg">
                    <svg class="w-7 h-7 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor"
                        stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z" />
                    </svg>
                </div>
                <span class="text-3xl font-extrabold text-slate-800 tracking-tight">Nexus<span
                        class="text-indigo-600">Desk</span></span>
            </a>
        </div>

        <div class="bg-white rounded-2xl shadow-xl overflow-hidden">
            <!-- Tabs -->
            <div class="flex border-b border-slate-200">
                <button id="tab-login" onclick="switchTab('login')"
                    class="flex-1 py-4 text-sm font-bold text-indigo-600 border-b-2 border-indigo-600">Sign In</button>
                <button id="tab-register" onclick="switchTab('register')"
                    class="flex-1 py-4 text-sm font-bold text-slate-500 hover:text-slate-700">Register</button>
            </div>

            <!-- Login Form -->
            <div id="form-login" class="p-8">
                <form id="login-form" class="space-y-5">
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">Email</label>
                        <input type="email" id="login-email" required
                            class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">Password</label>
                        <input type="password" id="login-password" required
                            class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                    <div class="text-right">
                        <button type="button" onclick="switchTab('forgot')"
                            class="text-sm text-indigo-600 hover:underline font-medium">Forgot password?</button>
                    </div>
                    <div id="login-error" class="text-red-500 text-sm hidden"></div>
                    <button type="submit"
                        class="w-full bg-indigo-600 text-white py-3 rounded-xl font-bold hover:bg-indigo-700 transition">Sign
                        In</button>
                </form>
            </div>

            <!-- Register Form -->
            <div id="form-register" class="p-8 hidden">
                <form id="register-form" class="space-y-5">
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">Full Name</label>
                        <input type="text" id="reg-name" required
                            class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">Email</label>
                        <input type="email" id="reg-email" required
                            class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">Password (min 6 chars)</label>
                        <input type="password" id="reg-password" required minlength="6"
                            class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                    <div id="reg-error" class="text-red-500 text-sm hidden"></div>
                    <button type="submit"
                        class="w-full bg-indigo-600 text-white py-3 rounded-xl font-bold hover:bg-indigo-700 transition">Create
                        Account</button>
                </form>
            </div>

            <!-- Forgot Password Form (Mock) -->
            <div id="form-forgot" class="p-8 hidden">
                <p class="text-slate-600 text-sm mb-6">Enter your email and we will send you a reset link.</p>
                <form id="forgot-form" class="space-y-5">
                    <input type="email" id="forgot-email" required placeholder="your@email.com"
                        class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-indigo-500 outline-none">
                    <button type="submit"
                        class="w-full bg-slate-800 text-white py-3 rounded-xl font-bold hover:bg-slate-900 transition">Send
                        Reset Link</button>
                    <button type="button" onclick="switchTab('login')"
                        class="w-full text-indigo-600 font-medium text-sm hover:underline">Back to Login</button>
                </form>
            </div>
        </div>
    </div>

        <script>
        function switchTab(tab) {
            document.querySelectorAll('[id^="form-"]').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('[id^="tab-"]').forEach(el => { el.classList.remove('text-indigo-600', 'border-b-2', 'border-indigo-600'); el.classList.add('text-slate-500'); });
            
            document.getElementById(`form-${tab}`).classList.remove('hidden');
            const tabBtn = document.getElementById(`tab-${tab === 'forgot' ? 'login' : tab}`);
            if(tabBtn) { tabBtn.classList.add('text-indigo-600', 'border-b-2', 'border-indigo-600'); tabBtn.classList.remove('text-slate-500'); }
        }

        // Safe way to read API responses (prevents JSON parse errors)
        async function parseResponse(res) {
            const text = await res.text();
            try {
                return JSON.parse(text);
            } catch (e) {
                throw new Error(text || 'Server error occurred');
            }
        }

        // Handle Registration
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            const errDiv = document.getElementById('reg-error');
            errDiv.classList.add('hidden');
            btn.textContent = 'Creating Account...'; 
            btn.disabled = true;

            const name = document.getElementById('reg-name').value;
            const email = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-password').value;

            try {
                const res = await fetch('/api/auth/register', {
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json' }, 
                    body: JSON.stringify({ name, email, password })
                });
                const data = await parseResponse(res);
                if (!res.ok) throw new Error(data.detail || 'Registration failed');

                alert('🎉 Registration Successful! Please log in.');
                e.target.reset();
                switchTab('login');
                document.getElementById('login-email').value = email;
                
            } catch (error) {
                errDiv.textContent = error.message;
                errDiv.classList.remove('hidden');
            } finally {
                btn.textContent = 'Create Account'; 
                btn.disabled = false;
            }
        });

        // Handle Login
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            const errDiv = document.getElementById('login-error');
            errDiv.classList.add('hidden');
            btn.textContent = 'Logging in...'; 
            btn.disabled = true;

            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json' }, 
                    body: JSON.stringify({ email, password })
                });
                const data = await parseResponse(res);
                if (!res.ok) throw new Error(data.detail || 'Invalid credentials');
                
                localStorage.setItem('token', data.access_token);
                window.location.href = '/dashboard';
                
            } catch (error) {
                errDiv.textContent = error.message;
                errDiv.classList.remove('hidden');
                btn.textContent = 'Sign In'; 
                btn.disabled = false;
            }
        });

        // Handle Forgot Password
        document.getElementById('forgot-form').addEventListener('submit', (e) => { 
            e.preventDefault(); 
            alert('Mock: Password reset link sent!'); 
            switchTab('login'); 
        });
    </script>
</body>

</html>
